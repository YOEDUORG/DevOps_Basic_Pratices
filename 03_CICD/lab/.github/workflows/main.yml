# ============================================
# GitHub Actions CI/CD Pipeline
# Buổi 3: Tự động Build, Test và Deploy
# ============================================

name: CI/CD Pipeline

# Kích hoạt khi có code push hoặc tạo pull request vào nhánh 'cicd'
on:
  push:
    branches: ["cicd"]
  pull_request:
    branches: ["cicd"]

jobs:
  # ===== JOB 1: BUILD & TEST =====
  build-and-test:
    name: 🧪 Build & Test
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Tải mã nguồn về runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Node.js môi trường
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Bước 3: Cài đặt thư viện
      - name: Install dependencies
        run: npm install

      # Bước 4: Chạy script test
      - name: Run tests
        run: npm test

  # ===== JOB 2: BUILD & PUSH DOCKER IMAGE =====
  docker-build-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test      # CHỈ CHẠY khi Job 1 (build-and-test) thành công
    if: github.event_name == 'push'  # Chỉ push image khi đó là event Push (không phải PR)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Đăng nhập vào Docker Hub sử dụng Secrets bảo mật
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build và Push image
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Gắn 2 tag: latest (bản mới nhất) và mã SHA của commit
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-basic-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-basic-app:${{ github.sha }}

      - name: 🎉 Deploy notification
        run: |
          echo "✅ Image đã được push lên Docker Hub thành công!"
          echo "📦 Image: ${{ secrets.DOCKERHUB_USERNAME }}/devops-basic-app:latest"
          echo "🏷️ SHA Tag: ${{ github.sha }}"
