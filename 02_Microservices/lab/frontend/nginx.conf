# ============================================
# Nginx Config — Frontend
# Serve static files
# ============================================
server {
    listen 80;
    server_name localhost;

    # Phục vụ file tĩnh (HTML, CSS, JS)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

}
